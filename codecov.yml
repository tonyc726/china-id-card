codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 80%
        threshold: 5%
    patch:
      default:
        target: 80%
        threshold: 5%

parsers:
  javascript:
    enable_partials: yes

ignore:
  - "node_modules/**"
  - "test/**"
  - "docs/**"
  - "dist/**"
  - "**/*.d.ts"
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/__snapshots__/**"

flags:
  unittests:
    paths:
      - src/**

comment:
  layout: "diff, flags, files"
  behavior: default
  require_base: false
  require_head: true
